<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>编辑博文 - 我的小博客</title>

    <!-- 引入mavon-editor -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/mavon-editor@2.10.4/dist/css/index.css">

    <style>
        body {
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background-color: #fafafa;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 5px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            color: #555;
        }

        input[type="text"],
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
            box-sizing: border-box;
        }

        textarea {
            height: 300px;
            resize: vertical;
        }

        .actions {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 20px;
        }

        .btn {
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }

        .btn-primary {
            background-color: #4CAF50;
            color: white;
        }

        .btn-secondary {
            background-color: #f1f1f1;
            color: #333;
        }

        /* 为编辑器容器设置固定高度 */
        .mavon-editor {
            height: 500px;
            overflow: auto;
        }

        footer {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            text-align: center;
            color: #888;
            font-size: 14px;
        }

        footer a {
            color: #555;
            text-decoration: none;
            margin: 0 8px;
        }

        footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<header>
    <h1>✏️ 编辑博文</h1>
</header>

<form id="editForm">
    <input type="hidden" id="id"/>

    <div class="form-group">
        <label for="articleTitle">文章标题</label>
        <input type="text" id="articleTitle" v-model="article.articleTitle" required/>
    </div>


    <div class="form-group">
        <label>文章内容</label>
        <mavon-editor ref="markdownEditor" v-model="article.articleContent"
                      :toolbars="toolbars"
                      :subfield="false"
                      :defaultOpen="'edit'"
                      :language="'zh-CN'">
        </mavon-editor>
    </div>

    <div class="form-group">
        <label for="articleTitle">文章摘要</label>
        <input type="text" id="articleSummary" v-model="article.articleSummary" required/>
    </div>


    <div class="actions">
        <button type="button" class="btn btn-secondary" onclick="window.history.back()">⬅️ 返回</button>
        <button type="submit" class="btn btn-primary" @click="submitUpdateArticle()">💾 保存修改</button>
    </div>
</form>

<footer>
    © 2025 我的小博客.
    <a href="/static">[返回首页]</a>
</footer>

<!-- axios引入 -->
<script src="https://unpkg.com/axios/dist/axios.min.js"></script>
<!-- vue2引入 -->
<script src="https://unpkg.com/vue@2.6.14/dist/vue.min.js"></script>

<!--<script src="https://cdn.jsdelivr.net/npm/mavon-editor@2.10.4/dist/mavon-editor.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/highlight.min.js"></script>-->


<script>
   // Vue.use(window.mavonEditor);

    //加载页面数据

    // 表单提交处理


    new Vue({
        el: '#editForm',
        data: {
            article: '',
            toolbars: {
                bold: true,        // 粗体
                italic: true,      // 斜体
                header: true,      // 标题
                underline: true,   // 下划线
                strikethrough: true, // 删除线
                mark: true,        // 标记
                superscript: true, // 上角标
                subscript: true,   // 下角标
                quote: true,       // 引用
                ol: true,          // 有序列表
                ul: true,          // 无序列表
                link: true,        // 链接
                imagelink: true,   // 图片链接
                code: true,        // 代码块
                table: true,       // 表格
                fullscreen: true,  // 全屏
                readmodel: true,   // 沉浸式阅读
                htmlcode: true,    // HTML源码
                help: true,        // 帮助
                undo: true,        // 撤销
                redo: true,        // 重做
                navigation: true   // 导航目录
            }
        },
        components:{
            'mavon-editor': window.mavonEditor
        },
        methods: {
            //处理修改后的文章数据
            submitUpdateArticle() {
                //获取修改后的文章数据
                const formData = {
                    id: document.getElementById('id').value || null,
                    articleTitle: document.getElementById('articleTitle').value.trim(),
                    articleContent: document.getElementById('articleContent').value.trim()
                };

                if (!formData.articleTitle || !formData.articleContent) {
                    alert('标题和内容不能为空！');
                    return;
                }

                axios.put('/articles/update', {
                        articleId: formData.id,
                        articleTitle: formData.articleTitle,
                        articleContent: formData.articleContent,
                    },
                    {
                        headers: {
                            'Content-Type': 'application/json'
                        }
                    }).then(response => {
                    console.log(response.data.data)
                    if (response.data.code == 1) {
                        alert('保存成功！');
                        window.location.href = '/Article/article.html'
                    } else {
                        alert('保存失败！');
                        window.location.href = '/'
                    }
                })
            }
        },
        //页面渲染完成后进行数据的更新
        mounted() {
            // 从 URL 获取文章 ID（假设格式为 edit-article.html?id=123）
            const urlParams = new URLSearchParams(window.location.search);
            const articleId = urlParams.get('editId');

            if (!articleId) {
                alert('文章ID不存在！');
                return;
            }
            console.log(articleId)
            // 获取文章数据
            axios.get('/articles/specificArticleForEdit?id=' + articleId)
                .then(response => {
                    console.log("~~请求成功~~")
                    console.log(response.data.data)
                    //返回了正确数据、成功信息
                    if (response.data.code == 1) {
                        this.article = response.data.data;
                    } else {
                        this.article = ''
                        console.log("获取数据失误")
                    }
                }).catch(err => {
                console.log("~~请求失败了~~", err);
            })


        }
    })
</script>

</body>
</html>
