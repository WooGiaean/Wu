<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <script src="https://unpkg.com/vue@2.6.14/dist/vue.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            max-width: 720px;
            margin: 2rem auto;
            padding: 0 1.5rem;
            line-height: 1.7;
            color: #333;
        }
        header {
            margin-bottom: 2rem;
            border-bottom: 1px solid #eee;
            padding-bottom: 1rem;
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }
        .note-meta {
            color: #666;
            font-size: 0.95rem;
        }
        a.back-link {
            display: inline-block;
            margin-bottom: 1.5rem;
            color: #1a73e8;
            text-decoration: none;
        }
        a.back-link:hover {
            text-decoration: underline;
        }
    </style>

</head>
<body>
<div id="note">
    <a href="note.html" class="back-link" style="color:burlywood;font-weight: bold">← 返回主页</a>

    <header>
        <h1>{{note.noteTopic}}</h1>
        <div class="note-meta">发布于 {{note.noteCreateTime}}</div>
    </header>

    <main>
        <strong style="font-size: 25px;font-weight: bolder;">
            {{note.noteContent}}
        </strong>
    </main>

    <div>
        <!-- 编辑随笔 -->
        <button class="btn-edit" @click="editNote(note.noteId)">
            ✏️ 编辑随笔
        </button>

        <!-- 删除笔记 -->
        <button class="btn-delete" @click="deleteNote(note.noteId)">
            🗑️ 删除随笔
        </button>

    </div>

    <footer>
        &copy; 2025 我的随笔内容.
    </footer>

</div>

<!-- 通过Vue进行数据的渲染 -->
<script>
    /* 获取路径参数 */
    let urlParams = new URLSearchParams(window.location.search);
    let noteId = urlParams.get('id');
    console.log("随笔id为："+noteId)
    /* 使用vue进行简单的也买你喧嚷 */
    new Vue({
        el:'#note',
        data:{
            note:{}
        },
        methods:{
            //编辑笔记
            editNote(id){
                console.log("准备进行修改笔记页面")
                window.location.href = '/Note/editNote.html?noteId='+id
            },
            //删除笔记
            deleteNote(id){
                axios.delete('/notes/delete/'+id)
                    .then(res=>{
                        console.log(res.data.code==1?"删除成功":"删除失败")
                        if(res.data.code==1){
                            this.note={}
                            alert("删除成功")
                            window.location.href = '/notes/'
                        }
                    })
                    .catch(err=>{
                        console.log(err)
                    })
            },
        },
        mounted(){
           axios.get('/notes/noteId?id='+noteId)
               .then(res=>{
               this.note=res.data.data
           })
        }
    })
</script>

</body>
</html>
