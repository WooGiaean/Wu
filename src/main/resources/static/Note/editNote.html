<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <script src="https://unpkg.com/vue@2.6.14/dist/vue.min.js"></script>
    <style>
        body {
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background-color: #fafafa;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 5px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            color: #555;
        }

        input[type="text"],
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
            box-sizing: border-box;
        }

        textarea {
            height: 300px;
            resize: vertical;
        }

        .actions {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 20px;
        }

        .btn {
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }

        .btn-primary {
            background-color: #4CAF50;
            color: white;
        }

        .btn-secondary {
            background-color: #f1f1f1;
            color: #333;
        }

        footer {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            text-align: center;
            color: #888;
            font-size: 14px;
        }

        footer a {
            color: #555;
            text-decoration: none;
            margin: 0 8px;
        }

        footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
<header>
    <h1>✏️ 编辑笔记</h1>
</header>

<form id="editForm" >
    <div class="form-group">
        <label for="noteTopic">笔记主题</label>
        <input type="text" id="noteTopic" required />
    </div>

    <div class="form-group">
        <label for="noteContent">笔记内容</label>
        <textarea id="noteContent" required>
        </textarea>

    </div>

    <div class="actions">
        <button type="button" class="btn btn-secondary" onclick="window.history.back()">⬅️ 返回</button>
        <button type="submit" class="btn btn-primary" >💾 保存修改</button>
    </div>
</form>

<footer>
    © 2025 我的小博客.
    <a href="/static">[返回首页]</a>
</footer>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const noteId = urlParams.get('noteId');

    if(noteId){
        axios.get('/notes/noteId?id='+noteId)
            .then(res=>{
                if (res.data.code===1){
                    console.log(res.data.data.noteTopic+":"+res.data.data.noteContent)
                    document.getElementById("noteTopic").value=res.data.data.noteTopic||"笔记主题"
                    document.getElementById("noteContent").value=res.data.data.noteContent||"笔记内容"
                }else {
                    alert("获取笔记失败")
                }
            }).catch(error=>{
                console.log(error)
                alert("错误原因："+error)
            })
    }


    /* 处理表单提交 */
    document.getElementById("editForm").addEventListener("submit", function (e){
        e.preventDefault()

        const newData={
            noteTopic: document.getElementById("noteTopic").value.trim(),
            noteContent:document.getElementById("noteContent").value.trim(),
        }


        axios.put('/notes/update',{
            noteTopic: newData.noteTopic,
            noteContent: newData.noteContent,
        },{
            headers: {
                'Content-Type': 'application/json'
            }
        }).then(response =>{
            if(response.data.code === 1){
                alert("修改成功")
                window.location.back()
            }else{
                alert("修改失败")
                window.location.href='note.html'
            }
        })




    })






</script>

</body>
</html>
