<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8" xmlns:th="http://www.thymeleaf.org"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>博客文章 - 拥抱清晨的宁静</title>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <script src="https://unpkg.com/vue@2.6.14/dist/vue.min.js"></script>
    <style>
        body {
            font-family: "Microsoft YaHei", sans-serif;
            line-height: 1.8;
            color: #333;
            background-color: #f9f9f9;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 1px solid #eee;
            padding-bottom: 15px;
        }

        h1 {
            color: #2c3e50;
        }

        .meta {
            color: #7f8c8d;
            font-size: 0.9em;
            margin-top: 10px;
        }

        .content {
            font-size: 16px;
            color: #2c3e50;
            text-align: justify;
        }

        .actions {
            margin-top: 20px;
        }

        .actions button {
            margin-right: 30px;
            padding: 6px 12px;
            cursor: pointer;
        }

        footer {
            margin-top: 40px;
            text-align: center;
            color: #95a5a6;
            font-size: 0.9em;
            border-top: 1px solid #eee;
            padding-top: 15px;
        }

        a {
            color: #3498db;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="container" id="article">

    <header>
        <h1>
            <strong>{{article.articleTitle}}</strong>
        </h1>
        <!-- <p class="meta">发布于：<span th:text="${article.articleCreateTime}"></span> | 作者：<span th:text="${article.blogger}"></span></p>-->
        <p>发布于：<span>{{article.articleCreateTime}}</span> | 作者：<span>{{article.blogger}}</span></p>
    </header>

    <!-- 显示博文内容 -->
    <div class="content" id="textContent">
        <strong>
            {{article.articleContent}}
        </strong>
    </div>

    <!-- 编辑和删除文章按钮的位置 -->
    <div class="actions">
        <button class="btn-info" @click="editArticle(article.articleId)">
            <a style="text-decoration: none;" @click="editArticle(article.articleId)">✏️ 编辑文章</a>
        </button>

        <button class="btn-delete" @click="confirmDelete(article.articleId)">
            <a style="text-decoration: none;" @click="editArticle(article.articleId)">🗑️ 删除文章</a>
        </button>

    </div>

    <hr>

    <!-- 评论区域 -->

    <div id="comments">
        <h2 style="text-align: center;">发表评论</h2>
        <textarea v-model="newComment" name="commentContent" rows="10" placeholder="请输入您的评论..."></textarea>
        <button type="submit">发表评论</button>
    </div>

   <!-- <div id="commentsList">
        <h3>评论{{comments.length}}条</h3>
        <div v-if="comments.length===0 ">暂无评论，快来抢沙发吧~ </div>
        <div v-else>
            <div class="comment-item" v-for="comment in comments" :key="comment.commentId">
                <span>{{comment.}}</span>
                <p></p>
            </div>
        </div>
    </div>-->





</div>


<footer>
    &copy; 2025 我的小博客. <a href="#">返回首页</a> | <a href="#comments">发表评论</a>
</footer>
</div>


<script>


    new Vue({
        el: '#article',
        data: {
            article: '',
            comments: [],
            newComment: ''
        },
        methods: {
            //修改文章
            editArticle(id) {
                console.log('正在执行修改文章' + id)
                window.location.href = '/articles/toEditPage?editId=' + id;
            },
            //删除文章
            confirmDelete(id) {
                console.log('正在执行删除文章' + id)
                axios.delete('/articles/delete/' + id)
                    .then(response => {
                        console.log(response.data.code == 1 ? '删除成功' : '删除失败')
                        if (response.data.code == 1) {
                            this.article = ''
                            window.location.href = '/articles/';
                        }
                    })
            }
        },
        //页面加载时显示文章
        mounted() {
            let Id = new URLSearchParams(window.location.search).get('id');
            if (Id == null) {
                alert("文章id无效")
                window.location.href = '/articles/'
                return;
            }
            console.log("文章id为：" + Id)
            axios.get('/articles/specificArticle?id=' + Id)
                .then(response => {
                    if (response.data.code === 1) {
                        console.log("成功跳转到具体的文章页面");
                        console.log(response.data.data);
                        this.article = response.data.data;
                    } else {
                        console.log("跳转失败：" + response.data.msg);
                        alert(response.data.msg)
                    }
                })
                .catch(error => {
                    console.log("请求失败：" + error);
                    window.location.href = '/articles/';
                });
        }
    });

</script>

</body>
</html>
