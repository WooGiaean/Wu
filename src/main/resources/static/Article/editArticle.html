<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>编辑博文 - 我的小博客</title>
    <style>
        body {
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background-color: #fafafa;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 5px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            color: #555;
        }

        input[type="text"],
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
            box-sizing: border-box;
        }

        textarea {
            height: 300px;
            resize: vertical;
        }

        .actions {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 20px;
        }

        .btn {
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }

        .btn-primary {
            background-color: #4CAF50;
            color: white;
        }

        .btn-secondary {
            background-color: #f1f1f1;
            color: #333;
        }

        footer {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            text-align: center;
            color: #888;
            font-size: 14px;
        }

        footer a {
            color: #555;
            text-decoration: none;
            margin: 0 8px;
        }

        footer a:hover {
            text-decoration: underline;
        }
    </style>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <script src="https://unpkg.com/vue@2.6.14/dist/vue.min.js"></script>
</head>
<body>

<header>
    <h1>✏️ 编辑博文</h1>
</header>

<form id="editForm" >
    <input type="hidden" id="id" />

    <div class="form-group">
        <label for="articleTitle">文章标题</label>
        <input type="text" id="articleTitle" required />
    </div>

    <div class="form-group">
        <label for="blogger">作者</label>
        <input type="text" id="blogger"  required />

    </div>

    <div class="form-group">
        <label for="articleContent">文章内容</label>
        <textarea id="articleContent" required>
        </textarea>

    </div>

    <div class="actions">
        <button type="button" class="btn btn-secondary" onclick="window.history.back()">⬅️ 返回</button>
        <button type="submit" class="btn btn-primary" >💾 保存修改</button>
    </div>
</form>

<footer>
    © 2025 我的小博客.
    <a href="/static">[返回首页]</a>
</footer>

<script>
    // 从 URL 获取文章 ID（假设格式为 edit-article.html?id=123）
    const urlParams = new URLSearchParams(window.location.search);
    const articleId = urlParams.get('editId');

    console.log(articleId)


    //加载页面数据
     if (articleId) {
         // 加载现有文章数据
         axios.get('/articles/specificArticle?id='+articleId)
             .then(response => {
                 if (response.data.code == 1 && response.data.data) {
                     const article = response.data.data;
                     document.getElementById('id').value = article.articleId || '博文id';
                     document.getElementById('articleTitle').value = article.articleTitle || '博文标题';
                     document.getElementById('blogger').value = article.blogger || '匿名';
                     document.getElementById('articleContent').value = article.articleContent || '博文内容';
                 } else {
                     alert('文章加载失败：' + (data.msg || '未知错误'));
                 }
             })
             .catch(err => {
                 console.error('加载文章出错:', err);
                 alert('网络错误，请重试');
             });
     }

     // 表单提交处理
     document.getElementById('editForm').addEventListener('submit', function(e) {
         e.preventDefault();

         //获取修改的数据
         const formData = {
             id: document.getElementById('id').value || null,
             articleTitle: document.getElementById('articleTitle').value.trim(),
             blogger: document.getElementById('blogger').value.trim(),
             articleContent: document.getElementById('articleContent').value.trim()
         };

         if (!formData.articleTitle || !formData.articleContent) {
             alert('标题和内容不能为空！');
             return;
         }

         axios.put('/articles/update',{
             articleId: formData.id,
             articleTitle: formData.articleTitle,
             blogger: formData.blogger,
             articleContent: formData.articleContent,
         },
             {
             headers: {
                 'Content-Type': 'application/json'
             }
         }).then(response => {
             console.log(response.data.data)
             if (response.data.code==1){
                 alert('保存成功！');
                 window.location.href='/Home/article.html'
             }else{
                 alert('保存失败！');
                 window.location.href='/'
             }
         }).catch(err=>{
             console.log(err)
             alert(err)
         })


     });

</script>

</body>
</html>
