<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>博客 - 简洁列表页</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" href="/css/allArticles.css"/>
</head>
<body>

<!-- 文章展示页面 -->
<div id="app">
    <!-- 头部搜索栏 -->
    <div class="header">
        <input type="text" id="searchCondition" v-model="keyword" class="search-bar" placeholder="搜索文章..."/>

        <button class="btn btn-primary" id="searchBtn"
                @click="search()" @keyup.enter="search()"/>
        搜索</button>

        <button class="btn btn-secondary" data-bs-toggle="modal"
                data-bs-target=".formModal">新增
        </button>
    </div>


    <!-- 侧边栏：分类导航 -->
   <!-- <div class="sidebar">
        <h3>文章分类</h3>
        <ul class="category-list" id="category-list"
            v-for="c in categories" :key="c.categoryId">
            &lt;!&ndash; 分类列表将由JavaScript动态生成 &ndash;&gt;
            <li>
                <a href="#">
                    {{c.categoryName}}
                </a>
            </li>
        </ul>
        <button class="add-category-btn" id="add-category-btn">+ 添加新分类</button>
    </div>-->

    <!-- 导航标签 -->
    <div class="nav-tabs">
        <div class="nav-tab active">历史博文</div>
    </div>


    <!-- 文章列表 -->
    <ul class="article-list" id="article-ul"> <!--id="app"-->
        <!-- 文章1 -->
        <li class="article-item" v-for="item in articles" :key="item.articleId"
            id="concreteArticle" @click="showSpecificArticle(item.articleId)">

            <div class="article-content">
                <div class="author">{{item.blogger}}</div>
                <h3 class="title">{{item.articleTitle}}</h3>
                <p class="excerpt">{{item.articleSummary}}</p>
                <div class="meta">
                    <span>👁️ 阅读 {{item.articleReadCount}}</span>
                    <span>👍 评论 {{item.articleCommentCount}}</span>
                    <span>🔖 收藏  {{item.articleLikeCount}}</span>
                </div>
                <div class="tags" v-if="item.tagList && item.tagList.length > 0">
                    <span class="tag" v-for="tag in item.tagList" :key="tag.tagId">{{tag.tagName}}</span>
                </div>
            </div>
            <img :src="'/uploaded-images/'+item.articleThumbnail" alt="博文缩略图" class="thumb">
            <!-- <img src="https://via.placeholder.com/80x60?text=HTML+JS" alt="技术图标" class="thumb" />-->
        </li>

    </ul>

    <!--无匹配的关键字 -->
    <h1 v-if="articles.length==0">
        暂无匹配的文章
    </h1>


    <!-- 弹窗页面(用于添加新文章) -->
    <div class="modal formModal" id="addArticleModal"
         tabindex="-1" aria-labelledby="addArticleModalLabel"
         aria-hidden="true">

        <div class="modal-dialog modal-lg">

            <div class="modal-content">

                <!-- 头部标题 -->
                <div class="modal-header">
                    <h5 class="modal-title"></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <!--  -->

                <div class="modal-body">
                    <!-- 表单开始 -->
                    <form id="addArticleForm">
                        <!-- 文章标题输入框 -->
                        <div class="mb-3">
                            <label for="title" class="form-label">标题</label>
                            <input type="text" class="form-control" id="title" placeholder="请输入博文标题">
                        </div>

                        <!-- 博客名称输入框 -->
                        <div class="mb-3">
                            <label for="blog-input" class="form-label">博客</label>
                            <input type="text" class="form-control" id="blog-input" placeholder="请输入博客名称">
                        </div>


                        <!-- 文章内容 -->
                        <div class="mb-3">
                            <label for="content-input" class="form-label">内容</label>
                            <textarea id="content-input" name="content" rows="10" cols="90" placeholder="请输入内容">
                            </textarea>
                        </div>


                        <!-- 文章概要 -->
                        <div class="mb-3">
                            <label for="summary-input" class="form-label">博文概要</label>
                            <input type="text" class="form-control" id="summary-input" placeholder="概要信息">
                        </div>

                        <!-- 图片上传 -->
                        <div class="mb-3">
                            <label for="coverImage" class="form-label">封面图片（可选）</label>
                            <input type="file" class="form-control" id="coverImage" accept="image/*"/>
                            <!-- 预览区域（可选） -->
                            <!--<div class="mt-2" id="imagePreview" style="max-width: 200px; display: none;">
                                <img id="previewImg" src="" alt="预览图" class="img-thumbnail" />
                            </div>-->
                        </div>

                    </form>
                    <!-- 表单结束 -->
                </div>


                <!-- 底部提交按钮以及取消按钮  -->
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">关闭</button>
                    <button type="button" class="btn btn-primary" @click="submitNew()"
                            data-bs-dismiss="modal">提交
                    </button>
                </div>

            </div>
        </div>
    </div>

</div>


<script src="https://unpkg.com/axios/dist/axios.min.js"></script>
<!-- Vue3 引入 -->
<!-- <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>-->
<!-- Vue2 -->
<script src="https://unpkg.com/vue@2.6.14/dist/vue.min.js"></script>
<!-- bootstrap 引入 -->
<!-- 引入bootstrap弹窗 -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"></script>

<!-- 前端逻辑脚本代码 -->
<script>


    /* 实现页面数据刷新 */
    const app = new Vue({
        el: '#app',
        data: {
            keyword: '',    //搜索框关键字
            articles: [],   //文章列表
            categories: [],   //分类列表
            page: 1,
            pageSize: 10,
        },
        methods: {
            //文章列表获取
            getAllArticles() {
                axios.get('/articles/list')
                    .then(response => {
                        console.log(response.data.data.records);
                        this.articles = response.data.data.records || [];
                        this.blogger = response.data.data.blogger;
                    })
                    .catch(error => {
                        console.error("请求发送失误", error)
                    })
            },

            //分类列表获取
            getCategories() {
                axios.get('/category/list')
                    .then(response => {
                        const result = response.data;
                        console.log(result.data)
                        /* 获取分类数据 */
                        if(result.code===1){
                            console.log("分类列表请求成功")
                            this.categories = result.data.records;
                        }else{
                            console.log("分类列表请求失败")
                            alert("分类列表请求失败")
                            this.categories = []
                        }
                        /* 进行赋值 */
                    }).catch( error=>{
                    console.error("请求发送错误", error)
                    this.categories = []
                    alert("请求发送错误")
                })
            },

            //查找具体某篇文章
            async search() {
                const keyWord = this.keyword.trim();
                console.log(keyWord)
                //判断关键字是否为空
                if (!keyWord) {
                    alert("关键字为空");
                    return;
                }
                //请求转发
                axios.post('/articles/searchCondition', {
                    articleTitle: keyWord,
                    articleContent: keyWord,
                    articleSummary: keyWord
                }).then(response => {
                    //通过在控制台请求是否正确发送和数据是否正确传输
                    console.log("请求转发成功");
                    const result = response.data
                    console.log(result);
                    //请求成功
                    if (result.code == 1 || result.success) {
                        console.log("后端数据返回成功")
                        //将查询成功的数据保存在articles中
                        this.articles = result.data;
                        console.log(result.data.records);
                    } else {
                        console.log("请求失败", result.msg || result.message)
                        this.articles = []
                        alert("查询失败")
                    }

                }).catch(error => {
                    console.error("请求发送错误", error)
                    this.articles = [];
                })
            },

            //新增文章
            async submitNew() {
                console.log("点击提交按钮")
                //获取普通文本字段
                let articleTitle = document.getElementById("title").value.trim();
                let articleBlogger = document.getElementById("blog-input").value;
                let articleContent = document.getElementById("content-input").value;
                let articleSummary = document.getElementById("summary-input").value.trim();

                console.log(articleTitle == null ? "无标题" : articleTitle)
                console.log(articleContent == null ? "无内容" : articleContent)

                //获取图片文件对象
                const fileInput = document.getElementById("coverImage");
                const file = fileInput.files[0];
                console.log(file.toString())

                //默认图片文件为空字符串
                let articleThumbnail = "";
                if (file) {
                    const formData = new FormData();
                    formData.append('file', file);
                    console.log("上传图片ing...")
                    const uploadRes = await axios.post('/images/upload', formData, {
                        headers: {'Content-Type': 'multipart/form-data'}
                    })

                    //图片上传失败
                    if (uploadRes.data.code == 0) {
                        alert("图片上传失败：" + (uploadRes.data.msg || "Unknown errors"))
                        return;
                    }
                    articleThumbnail = uploadRes.data.data;  //获取返回的文件名
                    console.log("上传图片成功，文件名：{}", articleThumbnail)
                }


                //上传博文内容
                await axios.post('/articles/insert', {
                    articleTitle: articleTitle,
                    blogger: articleBlogger,
                    articleContent: articleContent,
                    articleSummary: articleSummary,
                    articleThumbnail: articleThumbnail
                }).then(response => {
                    console.log(response.data.code === 1 ? "请求转发成功" : "请求转发失败")
                    alert(response.data.code === 1 ? "请求转发成功" : "请求转发失败")
                    new bootstrap.Modal(document.querySelector(".formModal")).hide();
                    //重新刷新
                    this.getAllArticles();
                    window.location.href = "/articles/"
                }).catch(error => {
                    console.error("请求发送错误", error)
                    alert("请求发送错误")
                })
            },

            //跳转到文章详情页面
            async showSpecificArticle(id) {
                console.log("点击了id为：" + id + "的文章")
                window.location.href = '/Article/article.html?id=' + id;
            }

        },

        // 页面渲染后立即执行
        mounted() {
            console.log("let's see how it work")
            //渲染文章数据
            this.getAllArticles()

            //渲染分类数据
            this.getCategories();
        }

    })

    /* 用于返回页面时，显示最新数据 */
    let reload = false;
    window.addEventListener('pageshow', function (e) {
        if (e.persisted && !reload) {
            reload = true;
            app.getAllArticles();
            setTimeout(() => {
                reload = false, 1000
            })
        }
    })

    /* 图片预览 */
    /* document.getElementById("coverImage").addEventListener('change',function (e){

     })*/
</script>


</body>
</html>
