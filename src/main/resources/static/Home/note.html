        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

            background: #fff;

        h1 { text-align: center; margin-bottom: 2rem; }

        .controls {
            display: flex;
            justify-content: space-between;

        input[type="text"] {

        #searchBtn,#addBtn{

        .note-item {
            padding: 1.2rem;
            margin-bottom: 1.2rem;
            border-radius: 8px;
            background: #f9f9f9;
            transition: background 0.2s;
        }
        .note-item:hover {
            transform: translateY(-3px);
            background: #f0f7ff;
            box-shadow: var(--shadow-hover);
        }
        .note-item h2 {
            margin: 0 0 0.4rem;
            font-size: 1.4rem;
        }
        .note-item h2 a {
            text-decoration: none;
            color: #d4b996;
        }
        .note-item h2 a:hover {
            text-decoration: underline;
        }
        .note-date {
            color: #666;
            font-size: 0.9rem;
            margin: 0.2rem 0;
            text-align: right;
        }
        .note-summary {
            color: #444;
            line-height: 1.5;
        }
    </style>
</head>
<body>

<h1>我的笔记</h1>

        <button id="searchBtn" class="btn-primary" @click="search()" @keyup.enter="search()">搜索</button>

        <button id="addBtn" class="btn-secondary" data-bs-toggle="modal" data-bs-target=".noteAdd">新增</button>

    </div>

    <!-- bootstrap表单,用于添加新笔记 -->
    <div class="modal noteAdd" id="addNoteModal" tabindex="-1" aria-labelledby="addNoteModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <!-- 标题头部  -->
                <div class="modal-header">
                    <h5 class="modal-title" id="addNoteModalLabel">新增笔记</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"/>
                </div>
                <!--  -->
                <!-- 中间提交内容  -->
                <div class="modal-body">
                    <form id="noteForm">
                        <div class="mb-3">
                            <label for="noteTopic" class="form-label">笔记标题</label>
                            <input type="text" v-model="newNote.topic" class="form-control" id="noteTopic" required>
                        </div>
                        <div class="mb-3">
                            <label for="noteContent" class="form-label">笔记内容</label>
                            <textarea class="form-control" v-model="newNote.content" id="noteContent" rows="6" required></textarea>
                        </div>
                    </form>
                </div>
                <!--  -->

                <!-- 底部按钮  -->
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary" id="saveNoteBtn"
                            @click="insertNew()" @keyup.enter="insertNew()">保存笔记</button>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                </div>
                <!--  -->
            </div>
        </div>
    </div>


</div>






<!-- 随笔内容显示列表 -->
<script>
    //笔记列表渲染
    new Vue({
        el:'#notes-list',
        data: {
            keyword:'', //搜索关键字
            notes: [],  //用于展示数据库中的列表数据
            newNote:{   //新增笔记
                topic: '',
                content: ''
            }
        },
        methods:{
            //跳转到具体页面
            turnToNote(id){
                console.log("点击了id为{}的文章",id);
                window.location.href = '/Home/specificNote.html?id='+id;
            },
            //关键字查询笔记
            search(){
                let word = this.keyword.trim();
                //关键字为空
                if (word==null){
                    alert("请输入关键字！")
                    return;
                }
                //关键字不为空
                axios.post('/notes/query',{
                    noteTopic: this.keyword,
                    noteContent: this.keyword
                })
                    .then(res => {
                        console.log("请求转发成功")
                        console.log(res.data.data.records);
                        let result = res.data;
                        if (result.code == 1 || result.success) {
                            console.log("后端数据返回成功")
                            //将查询成功的数据保存在articles中
                            this.notes = result.data.records;
                            console.log(result.data.records);
                        }else{
                            console.log("后端数据返回失败", result.msg || result.message)
                            this.notes=[];
                            alert("没有该笔记！")
                        }
                    }).catch(err=>{
                        console.error('请求转发失败', err);
                        this.notes=[];
                })


            },
            //添加新随笔
            insertNew(){
                console.log("点击了新增按钮")
                axios.post('/notes/insert',{
                    noteTopic: this.newNote.topic,
                    noteContent: this.newNote.content,
                }).then(res=>{
                    console.log("请求转发成功")
                     let result =res.data
                    console.log(result)
                    if (result.code == 1 || result.success) {
                        alert("添加成功！")
                        new bootstrap.Modal(document.querySelector(".noteAdd")).hide();
                        window.location.href='/notes/'
                    }
                }).catch(err=>{
                    console.error('请求转发失败', err);
                })

            },

        },
        //页面加载时渲染数据
        mounted(){
            axios.get('/notes/list')
                .then(res => {
                    console.log(res.data.data.records);
                    this.notes = res.data.data.records;
                })
                .catch(err=>{
                    console.error('加载失败', err);
                    document.getElementById('notes-list').innerHTML = '<p>⚠️ 无法加载笔记列表。</p>';
                })
        }
    })

</script>
