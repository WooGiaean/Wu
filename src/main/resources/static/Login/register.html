<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户注册</title>
    <style>
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .register-container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            width: 350px;
            max-width: 90%;
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        #btn-register {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            font-weight: 500;
            transition: transform 0.2s ease;
        }

        #btn-register:hover {
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
<div class="register-container">
    <h2>用户注册</h2>
        <div class="form-group">
            <label for="username">用户名</label>
            <input type="text" id="username"  required placeholder="请输入用户名">
        </div>

        <div class="form-group">
            <label for="userNickName">昵称</label>
            <input type="text" id="userNickName"  required placeholder="昵称">
        </div>

        <div class="form-group">
            <label for="email">邮箱</label>
            <input type="email" id="email" required placeholder="请输入邮箱地址">
        </div>

        <div class="form-group">
            <label for="password">密码</label>
            <input type="password" id="password" required placeholder="请输入密码">
        </div>

        <div class="form-group">
            <label for="confirm-password">确认密码</label>
            <input type="password" id="confirm-password"  required placeholder="请确认密码">
        </div>

        <button type="submit" id="btn-register">注册账号</button>
        <p>已有账号？<a href="/admin/">请登录</a></p>
</div>

<script src="https://unpkg.com/axios/dist/axios.min.js"></script>

<!--
 添加新用户：注册逻辑
-->
<script>
    //注册验证的逻辑
    document.getElementById('btn-register').addEventListener("click",function (e){
        e.preventDefault() //阻止表单提交



        let username = document.getElementById('username').value;
        let userNickname = document.getElementById('userNickName').value;
        let password = document.getElementById('password').value;
        let confirmPassword = document.getElementById('confirm-password').value;
        let email = document.getElementById('email').value;

        if(!username||!userNickname||!password||!confirmPassword||!email){
            alert("请填写完整信息")
            return
        }

        if (password !== confirmPassword){
            alert("两次密码不一致，请重新填写！")
            return;
        }

        console.log("点击注册")
        console.log( username+":"+password+":"+email)
        axios.post('/admin/register',{
            userName:  username,
            userNickname: userNickname,
            userPassword: password,
            userEmail: email
        }).then(response=>{
            const data = response.data
            console.log("注册响应"+data)
            if(data.code === 1){
                //注册成功后跳转到登录页面重新登录
                alert("注册成功")
                window.location.href='/Login/login.html'
            }else {
                alert("注册失败，"+data.message)
            }
        }).catch(error=>{
            console.log(error)
            alert(error.response.data.message)
        })

    })

</script>

</body>

</html>
