<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" xmlns:th="http://www.thymeleaf.org">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录页面</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #faf6f0 0%, #f2e9dc 100%);
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            background: white;
            padding: 30px 40px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            width: 320px;
            text-align: center;
        }

        h2 {
            color: #333;
            margin-bottom: 25px;
            font-weight: 500;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 14px;
            transition: border 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color:#d4b996;
        }


        button {
            background: linear-gradient(135deg, #d4b996 0%, #d4b996 100%);
            color: white;
            border: none;
            margin-bottom: 10px;
            padding: 12px 0;
            width: 100%;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        button:hover {
            transform: translateY(-2px);
        }

        .forgot-password {
            margin-top: 15px;
            font-size: 14px;
        }

        .forgot-password a {
            color: #667eea;
            text-decoration: none;
        }

        .forgot-password a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
<div class="login-container">
    <h2>用户登录</h2>
    <!-- 表单提交 --><!--action="/admin/loginCheck" method="post" -->
    <form id="loginForm" >
        <div class="form-group">
            <label for="username">用户名</label>
            <input type="text" id="username" name="username"  placeholder="请输入用户名" required>
        </div>
        <div class="form-group">
            <label for="password">密码</label>
            <input type="password" id="password"  name="password" placeholder="请输入密码" required>
        </div>


    </form>

    <!--
        验证码登录表单
    -->




    <!-- 登录和注册按钮 -->
    <button type="submit" id="submit_btn">登录</button>
    <button type="submit" id="register_btn">注册</button>
    <!-- 忘记密码设置
        验证码登录
     -->
    <div class="forgot-password">
        <a href="/Login/forgetPassword.html" style="margin-right: 80px">忘记密码？</a>
        <a href="#" id="codeLogin" data-bs-target=".codeModal"
           data-bs-toggle="modal">验证码登录</a>
    </div>
</div>
<!-- 验证码登录Modal -->
<div class="modal codeModal" id="captchaModal" tabindex="-1"
     aria-labelledby="captchaModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <!-- modal标题 -->
            <div class="modal-header">
                <h5 class="modal-title" id="captchaModalLabel">验证码登录</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>

            <!-- modal主体 -->
            <div class="modal-body">
                <div class="mb-3">
                    <label for="captchaEmail" class="form-label">邮箱</label>
                    <input type="email"  id="captchaEmail" placeholder="请输入注册邮箱">
                </div><!--class="form-control"-->
                <div class="mb-3">
                    <label for="captchaCode" class="form-label">验证码</label>
                    <div class="input-group">
                        <input type="text"  id="captchaCode" placeholder="请输入验证码">
                        <button class="btn btn-outline-secondary" type="button"
                                id="sendCaptchaBtn">发送验证码</button>
                    </div>
                </div>

                <div id="captchaMessage" class="text-danger"></div>
            </div>

            <!-- modal底部组件footer -->
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">关闭</button>
                <button type="button" class="btn btn-primary" id="verifyCaptchaBtn">验证</button>
            </div>
        </div>
    </div>
</div>

<script src="https://unpkg.com/axios/dist/axios.min.js"></script>
<script src="https://unpkg.com/vue"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"></script>

<script>


    /* 登录跳转并进行验证*/
    document.getElementById("submit_btn").addEventListener("click", function(e) {
       // e.preventDefault(); 阻止默认表单提交

        let username = document.getElementById('username').value;
        let password = document.getElementById('password').value;

        console.log( username+":"+ password)

        if (!username||!password){
            alert("请输入用户名或密码")
            return;
        }

        axios.post("/admin/loginCheck",JSON.stringify({  // 将数据转换为JSON字符串
            username: username,
            password: password
            }), {
                headers: {
                    'Content-Type': 'application/json'  // 指定请求头为JSON格式
                },
            credentials: 'include'
        },
        ).then(response => {
            //返回Result封装对象数据
            const result = response.data;
            console.log(result)
            if (result.code == 1) {
                // 登录成功：跳转至后台首页（示例路径，需根据实际页面调整）
                alert("登录成功")
                //判断当前用户角色：普通用户/管理员
                console.log(result.data.userRole)
                if(result.data.userRole =="admin"){
                    window.location.href= "/Admin/InfoCenter.html"
                }else{
                    window.location.href = "/Home/home.html";
                }
               // window.location.href = "/Home/home.html";
            } else {
                // 登录失败：弹窗提示错误
                console.error("登录失败：", result.message);
                alert(result.message);
            }
        })
            .catch(error => {
            console.error("登录请求异常：", error);
            alert("登录请求失败，请稍后再试");
        });

    })


    /* 发送验证码 */
    document.getElementById("sendCaptchaBtn").addEventListener("click", function() {
        let email = document.getElementById("captchaEmail").value;

        if(!email){
            alert("请输入邮箱!")
        }

        console.log("开始发送验证码...")

       axios.post('/admin/code2Email',{
           email: email
       }).then(res=>{
           console.log(res.data.code)
       }).catch(err=>{
           console.log("错误信息："+err)
       })

    })


    /* 判断验证码是否一致 */
    document.getElementById("verifyCaptchaBtn").addEventListener("click", function() {
        let email = document.getElementById("captchaEmail").value;
        let captchaCode = document.getElementById("captchaCode").value;

        if(!captchaCode){
            //alert("请输入验证码")
            document.getElementById("captchaMessage").innerHTML = "请输入验证码"
        }

        axios.post('/admin/verifyCodeLogin',{
            email:email,
            code: captchaCode
        },
        ).then(res=>{
            console.log(res.data.code)
            if (res.data.code===1){
                alert("验证成功")
                console.log(res.data.data)
                window.location.href = "/Home/home.html";
            }else{
                document.getElementById("captchaMessage").innerHTML = res.data.message
            }
        }).catch(err=>{
            console.log("错误信息："+err)
        })

    })

    /* 隐藏通道 */
   /* document.getElementById("submit_btn").addEventListener("click", function(e) {
        e.preventDefault();

        let username = document.getElementById('username').value;
        let password = document.getElementById('password').value;



        if (username=="wuhu" && password=="111"){
            window.location.href="tempLogin"
        }else if (username=="admin" && password=="admin"){
            window.location.href="index"
        }


    })*/


    /*
    * 跳转到注册页面
    * */
    document.getElementById("register_btn").addEventListener("click", function() {
        window.location.href = "/Login/register.html";
    })



</script>


</body>


</html>
